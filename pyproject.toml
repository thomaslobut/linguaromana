[tool.poetry]
name = "apprentissage-langues"
version = "0.1.0"
description = "LinguaRomana - Apprentissage des langues romanes avec l'actualité interactive"
authors = ["ThomasLobut <t.lobut@gmail.com>"]
readme = "README.md"
packages = [{include = "backend"}]

[tool.poetry.dependencies]
python = "^3.11"
django = "5.2.5"
djangorestframework = "3.16.1"
django-cors-headers = "4.7.0"
psycopg2-binary = "2.9.9"
dj-database-url = "2.1.0"
gunicorn = "21.2.0"
whitenoise = "6.6.0"
beautifulsoup4 = "4.12.2"
sentry-sdk = "1.38.0"
django-redis = "5.4.0"
pillow = "^10.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-django = "^4.5.0"
black = "^23.0.0"
flake8 = "^6.0.0"
isort = "^5.12.0"
requests = "^2.32.5"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
django-admin = "backend.manage:main"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
skip = ["migrations"]
