name: 🔍 Pre-commit Checks

on:
  pull_request:
    branches: [main, develop]

jobs:
  pre-commit-tests:
    runs-on: ubuntu-latest
    name: 🧪 Pre-commit Validation

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 📦 Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: 🔧 Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: 📦 Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --only=main --no-interaction

      - name: 🔧 Quick Django Setup
        run: |
          poetry run python backend/manage.py makemigrations --check --dry-run || poetry run python backend/manage.py makemigrations
          poetry run python backend/manage.py migrate

      - name: ⚡ Quick Streak Tests
        run: |
          poetry run python backend/manage.py test authentication.test_streak.StreakSystemTestCase.test_user_with_one_flame_gets_two_flames_next_day -v 1
          poetry run python backend/manage.py test authentication.test_streak.StreakSystemTestCase.test_user_with_one_flame_no_two_flames_same_day -v 1

      - name: 🔍 Code Syntax Check
        run: |
          poetry run python -m py_compile backend/authentication/utils.py
          poetry run python -m py_compile backend/authentication/test_streak.py
          poetry run python -m py_compile backend/authentication/views.py

      - name: ✅ Pre-commit Summary
        run: |
          echo "🎉 Pre-commit checks passed!"
          echo "✅ Core streak tests: OK"
          echo "✅ Code syntax: OK"
          echo "🚀 Ready for review"
