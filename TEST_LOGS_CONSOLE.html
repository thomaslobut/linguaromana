<!DOCTYPE html>
<html>
<head>
    <title>Test des logs JavaScript</title>
</head>
<body>
    <h1>Test Console - LinguaRomana</h1>
    <p>Ouvrez la console développeur (F12) pour voir les logs.</p>
    
    <div id="status">Chargement...</div>
    
    <script>
        console.log('🔍 TEST: Page de test chargée');
        
        // Charger le script complet depuis Django
        const script = document.createElement('script');
        script.src = 'http://localhost:8000/static/script.js';
        script.onload = function() {
            console.log('✅ TEST: script.js chargé');
            console.log('🔍 TEST: ArchiveManager défini ?', typeof ArchiveManager !== 'undefined');
            
            if (typeof ArchiveManager !== 'undefined') {
                console.log('✅ TEST: Création instance ArchiveManager...');
                try {
                    const testManager = new ArchiveManager();
                    console.log('✅ TEST: ArchiveManager créé avec succès');
                    console.log('🔍 TEST: loadLatestArticle existe ?', typeof testManager.loadLatestArticle === 'function');
                    
                    if (typeof testManager.loadLatestArticle === 'function') {
                        console.log('🔄 TEST: Appel loadLatestArticle()...');
                        testManager.loadLatestArticle();
                    }
                } catch (error) {
                    console.error('❌ TEST: Erreur création ArchiveManager:', error);
                }
            } else {
                console.error('❌ TEST: ArchiveManager non défini dans script.js');
            }
        };
        script.onerror = function() {
            console.error('❌ TEST: Impossible de charger script.js');
        };
        document.head.appendChild(script);
    </script>
</body>
</html>
